<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مراقبة المياه</title>
<style>
body{margin:0;padding:0;background:#030d1a;color:#fff;font-family:'Cairo',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.container{text-align:center;padding:20px;}
.icon{font-size:80px;margin-bottom:20px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:2.5rem;margin-bottom:10px;background:linear-gradient(90deg,#00e5ff,#00b8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;}
p{font-size:1.1rem;color:rgba(255,255,255,.7);margin-bottom:30px;}
.btn-group{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;}
a{padding:12px 24px;border-radius:30px;text-decoration:none;font-weight:700;font-size:1rem;border:2px solid;transition:all .3s;cursor:pointer;}
.btn-1{background:linear-gradient(135deg,#00e5ff,#00b8a0);color:#030d1a;border-color:#00e5ff;}
.btn-1:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,229,255,.3);}
.btn-2{background:transparent;color:#00e5ff;border-color:#00e5ff;}
.btn-2:hover{background:rgba(0,229,255,.1);transform:translateY(-3px);}
.info{font-size:.9rem;color:rgba(255,255,255,.5);margin-top:30px;}
</style>
</head>
<body>
<div class="container">
  <div class="icon">💧</div>
  <h1>نظام مراقبة المياه</h1>
  <p>إدارة الخزانات والموردين بكفاءة عالية</p>
  
  <div class="btn-group">
    <a href="page1.html" class="btn-1">📊 لوحة الخزانات</a>
    <a href="page2.html" class="btn-2">🏢 الموردين</a>
  </div>
  
  <div class="info">
    <p>اختر الصفحة التي تريد الدخول إليها</p>
  </div>
</div>
</body>
</html>
